<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackjack Book</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1917;color:#eff5eb}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:28px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a4038;padding-bottom:20px}.brand{font-weight:800;letter-spacing:.12em;font-size:14px}.mark{color:#d4e881;font-size:24px;margin-right:8px}.eyebrow{font-size:12px;color:#bbd977;letter-spacing:.16em;font-weight:700;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(40px,7vw,70px);line-height:1.05;letter-spacing:-.04em;margin:16px 0}h2{font-family:Georgia,serif;font-size:28px;margin:0 0 20px}p{color:#a9bcb1;line-height:1.6}.hero{padding:65px 0 35px;max-width:680px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#142723;border:1px solid #2b443a;border-radius:16px;padding:24px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#c5d6ca;font-size:13px;margin:14px 0 6px}input,select{width:100%;background:#0e1e1a;border:1px solid #3c574a;border-radius:8px;color:#fff;padding:12px;font:inherit}input[type=checkbox]{width:auto}button{border:0;border-radius:8px;background:#cbe77e;color:#152019;font-weight:800;padding:13px 18px;cursor:pointer;margin-top:18px}button.secondary{background:#263e35;color:#e4f3e4}button:disabled{opacity:.5}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:36px 0}.code{font-size:36px;letter-spacing:.15em;font-weight:800;color:#d5eb8e}.players{display:grid;gap:8px}.player{display:flex;justify-content:space-between;align-items:center;background:#1a3029;border-radius:9px;padding:14px}.muted{color:#a7bbaf;font-size:13px}.pill{color:#d2e99b;font-size:12px}.error{color:#ffb7a9;min-height:22px}.round{background:#d1e893;color:#15251b;padding:20px;border-radius:12px;margin-bottom:20px}.round h2{margin:5px 0;color:#15251b}.round p{color:#334b34;margin:0}.result{display:grid;grid-template-columns:1fr 110px 150px;gap:10px;align-items:end;margin-bottom:12px}.result strong{padding-bottom:12px}details{margin-top:24px}summary{cursor:pointer;color:#d0e1d4}li{margin:10px 0;color:#bfd0c2}footer{margin-top:44px;color:#809a8b;font-size:12px}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}.result{grid-template-columns:1fr 1fr}.result strong{grid-column:1/-1;padding:0}.top{align-items:flex-start;flex-direction:column}}
</style><main><header><div class="brand"><span class="mark">♠</span> BLACKJACK BOOK</div><span class="muted">REAL CARDS. SHARED SCORES.</span></header><div id="app"></div><footer>Play with your own cards. Scores are recorded here; cards are never dealt online.</footer></main><script src="/qrcode.js"></script><script>
let session=JSON.parse(localStorage.getItem('bb-session')||'null'),game=null,busy=false;const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
async function api(data){let r=await fetch('https://WORKER_URL_PENDING',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error);return v}function error(e){document.querySelector('.error').textContent=e.message}function remember(v){session={code:v.game.code,token:v.token};localStorage.setItem('bb-session',JSON.stringify(session));game=v.game;render()}
function home(){let joining=location.pathname.startsWith('/join');app.innerHTML=`<div class="hero"><div class="eyebrow">Your table, sorted</div><h1>Deal the cards.<br>We'll keep score.</h1><p>A simple shared book for your real-life blackjack games. Set up a table, invite your friends and keep every round in one place.</p></div><div class="grid"><form class="card" id="create" ${joining?'hidden':''}><h2>Host a table</h2><label>Your name</label><input name="name" required maxlength="24" placeholder="Enter your name"><div class="row"><div><label>Number of players</label><input name="count" type="number" min="2" max="12" value="3" required></div><div><label>Rounds per dealer</label><input name="turns" type="number" min="1" max="100" value="5" required></div></div><label>Starting balance</label><input name="start" type="number" min="0" max="1000000" step="0.01" value="2000" required><label><input name="random" type="checkbox" checked> Randomise dealer order</label><button>Create table →</button></form><form class="card" id="join" ${joining?'':'hidden'}><h2>Join a table</h2><p>Have a code from your host? Enter it below.</p><label>Your name</label><input name="name" required maxlength="24" placeholder="Enter your name"><label>Table code</label><input name="code" required maxlength="6" placeholder="e.g. A1B2C3" value="${esc(new URLSearchParams(location.search).get('code')||'')}" style="text-transform:uppercase"><button>Join table →</button></form></div><p><a href="${joining?'/':'/join'}" style="color:#d5eb8e">${joining?'Want to host a table?':'Joining a table?'}</a></p><p class="error" role="alert"></p>`;document.querySelector('#create').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{remember(await api({action:'create',name:f.get('name'),count:f.get('count'),turns:f.get('turns'),start:f.get('start'),random:f.has('random')}))}catch(x){error(x)}};document.querySelector('#join').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{remember(await api({action:'join',name:f.get('name'),code:f.get('code')}))}catch(x){error(x)}}}
function render(){if(!game)return home();let g=game,dealer=g.players.find(p=>p.id===g.order[Math.floor((g.round-1)/g.config.turns)%g.order.length]);app.innerHTML=`<div class="top"><div><div class="eyebrow">${g.status==='lobby'?'Waiting room':'Game in progress'}</div><h1>${g.status==='lobby'?'Your table is ready.':'Round '+g.round}</h1></div><div><div class="muted">TABLE CODE</div><div class="code">${esc(g.code)}</div><button class="secondary" id="copy">Copy code</button> ${g.host?'<button class="secondary" id="invite">Invite players</button>':''}</div></div><div class="grid"><section class="card"><h2>${g.status==='lobby'?'Players in lobby':'The table'}</h2><div class="players">${g.players.map(p=>`<div class="player"><span>${esc(p.name)} ${p.id===g.me?'<span class="muted">(you)</span>':''}</span><span>${g.status==='playing'?fmt(p.balance):'<span class="pill">Joined</span>'}</span></div>`).join('')}</div><p>${g.players.length} / ${g.config.count} players · ${g.config.turns} rounds per dealer</p>${g.status==='lobby'&&g.host?`<button id="start" ${g.players.length!==g.config.count?'disabled':''}>Start game →</button><p class="muted">${g.players.length!==g.config.count?'Waiting for everyone to join.':'Everyone is here.'}</p>`:''}</section><section class="card">${g.status==='lobby'?`<h2>Invite your players</h2><p>Share the table code and this website's address. Players will appear here as they join.</p><p>Starting balance: <strong>${fmt(g.config.start)}</strong><br>Dealer order: <strong>${g.config.random?'Randomised':'Join order'}</strong></p>`:`<div class="round"><span class="eyebrow" style="color:#435b2c">DEALER</span><h2>${esc(dealer.name)}</h2><p>Round ${(g.round-1)%g.config.turns+1} of ${g.config.turns} as dealer</p></div>${g.host?`<h2>Record results</h2><p>Enter each player's bet and outcome against the dealer.</p><form id="settle">${g.players.filter(p=>p.id!==dealer.id).map(p=>`<div class="result"><strong>${esc(p.name)}</strong><div><label>Bet</label><input type="number" min="0" max="1000000" step="0.01" required name="bet-${p.id}" placeholder="0"></div><div><label>Result</label><select required name="result-${p.id}"><option value="">Select</option><option value="W">Win</option><option value="L">Loss</option><option value="BJ">Blackjack</option><option value="P">Push</option></select></div></div>`).join('')}<button>Save round →</button></form>`:'<h2>Playing in person</h2><p>Your host will record each result. Balances and dealer turns update automatically.</p>'}`}</section></div><div id="invitebox"></div><p class="error" role="alert"></p>${g.history.length?`<details><summary>Round history (${g.history.length})</summary><ol reversed>${[...g.history].reverse().map(h=>`<li>Round ${h.round} · Dealer: ${esc(h.dealer)}<br><span class="muted">${h.changes.map(c=>`${esc(c.name)}: ${c.result} on ${fmt(c.bet)} (${c.delta>=0?'+':''}${fmt(c.delta)})`).join(' · ')}</span></li>`).join('')}</ol></details>`:''}<button class="secondary" id="leave">Return to start</button>`;
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(g.code).then(()=>document.querySelector('#copy').textContent='Copied!');let inv=document.querySelector('#invite');if(inv)inv.onclick=()=>{let link=location.origin+'/join?code='+encodeURIComponent(g.code);let qr=qrcode(0,'M');qr.addData(link);qr.make();document.querySelector('#invitebox').innerHTML=`<section class="card" style="margin-top:18px"><h2>Invite players</h2><p>Scan the code or share the link to join this table.</p><div style="background:white;padding:12px;display:inline-block;border-radius:8px">${qr.createSvgTag({cellSize:4,margin:4})}</div><label>Invite link</label><input readonly value="${esc(link)}"><button id="copylink">Copy invite link</button></section>`;document.querySelector('#copylink').onclick=()=>navigator.clipboard.writeText(link).then(()=>document.querySelector('#copylink').textContent='Copied!')};document.querySelector('#leave').onclick=()=>{localStorage.removeItem('bb-session');session=null;game=null;home()};let start=document.querySelector('#start');if(start)start.onclick=()=>act({action:'start'});let form=document.querySelector('#settle');if(form)form.onsubmit=e=>{e.preventDefault();let f=new FormData(form);act({action:'settle',round:g.round,results:g.players.filter(p=>p.id!==dealer.id).map(p=>({id:p.id,bet:f.get('bet-'+p.id),result:f.get('result-'+p.id)}))})}}
async function act(a){try{let v=await api({...session,...a});game=v.game;render()}catch(e){error(e)}}async function poll(){if(!session||busy)return;try{let v=await api({...session,action:'get'});if(JSON.stringify(v.game)!==JSON.stringify(game)){game=v.game;render()}}catch{}}if(session)poll();else home();setInterval(poll,2500);
</script></html>
